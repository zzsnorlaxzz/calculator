  <main class="lesson-layout">
    <aside class="condition-column">
      <section class="lesson-panel" aria-labelledby="conditions-title">
        <h2 class="panel-heading" id="conditions-title">조건 선택<span class="panel-note" id="selection-count">0 / 3개</span></h2>
        <fieldset id="condition-options" aria-label="삼각형 조건 (최대 3개)">
          <label><input type="checkbox" value="AB">선분 AB</label>
          <label><input type="checkbox" value="BC">선분 BC</label>
          <label><input type="checkbox" value="CA">선분 CA</label>
          <label><input type="checkbox" value="A">각 A</label>
          <label><input type="checkbox" value="B">각 B</label>
          <label><input type="checkbox" value="C">각 C</label>
        </fieldset>
        <p id="condition-feedback" role="status">조건은 최대 3개까지 선택할 수 있습니다.</p>
      </section>
      <section class="lesson-panel conditions-panel" aria-labelledby="given-title">
        <h2 class="panel-heading" id="given-title">주어진 조건</h2>
        <div id="condition-cards" aria-live="polite"></div>
      </section>
    </aside>
    <section class="lesson-panel drawing-panel" aria-labelledby="drawing-title">
      <h2 class="panel-heading" id="drawing-title">작도 공간<span class="panel-note">고정 배율</span></h2>
      <div id="canvas-container">  <button id="quick-eraser-btn">
    지우개<br><small>누른 채로</small>
  </button></div>
      <div id="status-bar" role="status">도구를 선택하여 작도하세요.</div>
    </section>
    <canvas id="geometryCanvas" aria-label="주어진 조건과 작도 공간에 함께 사용하는 작도판"></canvas>
  </main>

  <script>
    const canvas = document.getElementById('geometryCanvas');
    const ctx = canvas.getContext('2d');
    const statusBar = document.getElementById('status-bar');
    const imageInput = document.getElementById('image-input');
    const colorPicker = document.getElementById('color-picker');

    let scale = 1;
    let originX = 0;
    let originY = 0;

    let currentColor = '#374151';
    let currentTool = 'pan'; 

    let compassStep = 0;
    let compassInitialCenter = null;
    let compassCenter = null;
    let compassRadius = 0;
    let compassCurrentAngle = 0;
    let compassDrawStartAngle = 0;
    let compassDrawEndAngle = 0;

    let protractorStep = 0;
    let protractorCenter = null;
    let protractorRadius = 0;
    let protractorStartAngle = 0;
    let protractorCurrentAngle = 0;

    let globalRuler = null; 
    let globalRulerP1 = null;

    let isDrawingLinear = false;
    let linearStart = null;
    let isDrawingPen = false;
    let currentPath = [];

    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;

    let mouseWorld = { x: 0, y: 0 };
    let activeSnapPoint = null;

    let elements = [];
    const undoStack = [];
    const redoStack = [];

    let selectedImage = null;
    let isDraggingImage = false;
    let isResizingImage = false;
    let dragOffset = { x: 0, y: 0 };

    let isSelectingLasso = false;
    let lassoPolygon = [];
    let selectedElements = [];
    let selectionBox = null;
    let isTransformingSelection = false;
    let transformMode = null;
    let transformStartMouse = null;
    let originalSelectedBounds = null;
    let initialElementsState = null;
    let transformCenter = null;
    let transformStartAngle = 0;
    let selectionRotation = 0;

    const activePointers = new Map();
    let initialPinchDist = null;
    let initialPinchScale = 1;
    let initialPanMid = null;
    let initialOrigin = { x: 0, y: 0 };

    let tempEraserMode = false;
    let savedTool = null;
    let buttonTriggeredEraser = false;

    window.addEventListener('contextmenu', e => e.preventDefault());

    let drawingRegions = [];
    let conditionGeometry = [];
    let conditionLabels = [];
    function localRect(element) {
      const rect = element.getBoundingClientRect();
      const base = canvas.getBoundingClientRect();
      return { x: rect.left - base.left, y: rect.top - base.top, w: rect.width, h: rect.height };
    }
    function resizeCanvas() {
      const layout = document.querySelector('.lesson-layout');
      canvas.width = layout.clientWidth;
      canvas.height = layout.clientHeight;
      const given = localRect(document.getElementById('condition-cards'));
      const workspace = localRect(document.getElementById('canvas-container'));
      drawingRegions = [given, workspace];
      // Separate subpaths keep the condition controls, headers and gap clickable.
      canvas.style.clipPath = 'path("' + drawingRegions.map(r =>
        'M' + r.x + ' ' + r.y + ' h' + r.w + ' v' + r.h + ' h-' + r.w + ' Z').join(' ') + '")';
      layoutConditions(given);
      const baselineLength = Math.min(360, workspace.w * 0.64);
      const baselineY = workspace.y + workspace.h * 0.64;
      conditionGeometry.push({
        type:'segment',
        p1:{x:workspace.x+(workspace.w-baselineLength)/2,y:baselineY},
        p2:{x:workspace.x+(workspace.w+baselineLength)/2,y:baselineY},
        color:'#64748b',hideStartPoint:true,hideEndPoint:true,isBaseline:true
      });
      render();
    }
    function inDrawingRegion(point) {
      return drawingRegions.some(r => point.x >= r.x && point.x <= r.x+r.w && point.y >= r.y && point.y <= r.y+r.h);
    }
    function layoutConditions(area) {
      conditionGeometry = [];
      conditionLabels = [];
      const selected = [...document.querySelectorAll('#condition-options input:checked')].map(input => input.value);
      const rowHeight = area.h / Math.max(1, selected.length);
      selected.forEach((key, index) => {
        const top = area.y + index * rowHeight;
        conditionLabels.push({ text: key.length === 2 ? '선분 ' + key : '각 ' + key, x: area.x + 20, y: top + 28, heading: true });
        const color = '#2563eb';
        if (key.length === 2) {
          const length = triangleSides[key] * 40;
          const p1 = { x: area.x + (area.w-length)/2, y: top+rowHeight*.57 };
          const p2 = { x: p1.x+length, y: p1.y };
          conditionGeometry.push({type:'segment',p1,p2,color});
          conditionLabels.push({text:key[0],x:p1.x-6,y:p1.y+24},{text:key[1],x:p2.x-6,y:p2.y+24});
        } else {
          const rad = triangleAngles[key] * Math.PI/180;
          // Keep one ray horizontal, parallel to the construction baseline.
          const directions = [0,-rad];
          const unitPoints = [{x:0,y:0},...directions.map(a=>({x:Math.cos(a),y:Math.sin(a)}))];
          const minX=Math.min(...unitPoints.map(p=>p.x)),maxX=Math.max(...unitPoints.map(p=>p.x));
          const minY=Math.min(...unitPoints.map(p=>p.y)),maxY=Math.max(...unitPoints.map(p=>p.y));
          const availableHeight=Math.max(24,rowHeight-44);
          const rayLength=Math.min(220,(area.w-64)/(maxX-minX),availableHeight/(maxY-minY));
          const vertex={x:area.x+(area.w-rayLength*(maxX-minX))/2-rayLength*minX,
            y:top+34+(availableHeight-rayLength*(maxY-minY))/2-rayLength*minY};
          const ends=directions.map(a=>({x:vertex.x+rayLength*Math.cos(a),y:vertex.y+rayLength*Math.sin(a)}));
          conditionGeometry.push({type:'segment',p1:vertex,p2:ends[0],color,hideEndPoint:true},{type:'segment',p1:vertex,p2:ends[1],color,hideEndPoint:true});
          conditionLabels.push({text:key,x:vertex.x-18,y:vertex.y+5});
        }
      });
    }
    function drawConditionLabels() {
      ctx.save();
      for (const label of conditionLabels) {
        ctx.fillStyle = label.heading ? '#334155' : '#2563eb';
        ctx.font = (label.heading ? '600 15px' : '15px') + ' sans-serif';
        ctx.fillText(label.text,label.x,label.y);
      }
      if (!conditionLabels.length) {
        const area=drawingRegions[0];
        if (area) {
          ctx.fillStyle='#64748b';ctx.font='14px sans-serif';
          ctx.fillText('위에서 조건을 선택하세요.',area.x+24,area.y+46);
        }
      }
      ctx.restore();
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
    document.addEventListener('DOMContentLoaded', resizeCanvas);
    window.addEventListener('load', () => setTimeout(resizeCanvas, 150));

    function screenToWorld(sx, sy) {
      const rect = canvas.getBoundingClientRect();
      return { x: Math.max(0, Math.min(canvas.width, sx - rect.left)), y: Math.max(0, Math.min(canvas.height, sy - rect.top)) };
    }

    function isAngleOnArc(angle, startAngle, endAngle) {
      const normalize = a => {
        let res = a % (Math.PI * 2);
        if (res < 0) res += Math.PI * 2;
        return res;
      };
      const a = normalize(angle);
      const s = normalize(startAngle);
      const e = normalize(endAngle);
      if (s <= e) return a >= s && a <= e;
      return a >= s || a <= e;
    }

    function getOrthoTarget(start, current) {
      const dx = current.x - start.x;
      const dy = current.y - start.y;
      const dist = Math.hypot(dx, dy);
      if (dist === 0) return current;

      let angle = Math.atan2(dy, dx);
      let orthoAngle = Math.round(angle / (Math.PI / 2)) * (Math.PI / 2);
      let diff = Math.abs(angle - orthoAngle);
      if (diff > Math.PI) diff = Math.PI * 2 - diff; 

      if (diff < 0.08) {
        if (Math.abs(Math.cos(orthoAngle)) > 0.5) return { x: current.x, y: start.y };
        else return { x: start.x, y: current.y };
      }
      return current;
    }

    function linearIntersection(l1, l2) {
      const p1 = l1.p1, p2 = l1.p2;
      const p3 = l2.p1, p4 = l2.p2;
      const denom = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
      if (Math.abs(denom) < 1e-9) return null;
      const t = ((p1.x - p3.x) * (p3.y - p4.y) - (p1.y - p3.y) * (p3.x - p4.x)) / denom;
      const u = -((p1.x - p2.x) * (p1.y - p3.y) - (p1.y - p2.y) * (p1.x - p3.x)) / denom;
      const tValid = (l1.type === 'line' || l1.type === 'ruler') || (t >= 0 && t <= 1);
      const uValid = (l2.type === 'line' || l2.type === 'ruler') || (u >= 0 && u <= 1);
      if (tValid && uValid) return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
      return null;
    }

    function linearArcIntersection(linear, arc) {
      const p1 = linear.p1, p2 = linear.p2;
      const dx = p2.x - p1.x; const dy = p2.y - p1.y;
      const fx = p1.x - arc.center.x; const fy = p1.y - arc.center.y;
      const a = dx * dx + dy * dy;
      const b = 2 * (fx * dx + fy * dy);
      const c = (fx * fx + fy * fy) - arc.radius * arc.radius;
      let discriminant = b * b - 4 * a * c;
      if (discriminant < 0) return [];
      discriminant = Math.sqrt(discriminant);
      const t1 = (-b - discriminant) / (2 * a);
      const t2 = (-b + discriminant) / (2 * a);
      const pts = [];
      [t1, t2].forEach(t => {
        const tValid = (linear.type === 'line' || linear.type === 'ruler') || (t >= 0 && t <= 1);
        if (tValid) {
          const ix = p1.x + t * dx; const iy = p1.y + t * dy;
          const ang = Math.atan2(iy - arc.center.y, ix - arc.center.x);
          if (isAngleOnArc(ang, arc.startAngle, arc.endAngle)) pts.push({ x: ix, y: iy });
        }
      });
      return pts;
    }

    function arcArcIntersection(arc1, arc2) {
      const d = Math.hypot(arc2.center.x - arc1.center.x, arc2.center.y - arc1.center.y);
      if (d > arc1.radius + arc2.radius || d < Math.abs(arc1.radius - arc2.radius) || d === 0) return [];
      const a = (arc1.radius * arc1.radius - arc2.radius * arc2.radius + d * d) / (2 * d);
      const h = Math.sqrt(Math.max(0, arc1.radius * arc1.radius - a * a));
      const x2 = arc1.center.x + a * (arc2.center.x - arc1.center.x) / d;
      const y2 = arc1.center.y + a * (arc2.center.y - arc1.center.y) / d;
      const rx = -(arc2.center.y - arc1.center.y) * (h / d);
      const ry = (arc2.center.x - arc1.center.x) * (h / d);
      const candidatePoints = [{ x: x2 + rx, y: y2 + ry }, { x: x2 - rx, y: y2 - ry }];
      const results = [];
      candidatePoints.forEach(p => {
        const ang1 = Math.atan2(p.y - arc1.center.y, p.x - arc1.center.x);
        const ang2 = Math.atan2(p.y - arc2.center.y, p.x - arc2.center.x);
        if (isAngleOnArc(ang1, arc1.startAngle, arc1.endAngle) && isAngleOnArc(ang2, arc2.startAngle, arc2.endAngle)) {
          results.push(p);
        }
      });
      return results;
    }

    // 자유 드로잉 패스와 다른 객체의 교점 찾기
    function getPathIntersections(pathEl, otherEl) {
      const pts = [];
      for (let k = 0; k < pathEl.points.length - 1; k++) {
        const seg = { type: 'segment', p1: pathEl.points[k], p2: pathEl.points[k + 1] };
        if (['segment', 'line', 'ruler'].includes(otherEl.type)) {
          const pt = linearIntersection(seg, otherEl);
          if (pt) pts.push(pt);
        } else if (otherEl.type === 'arc') {
          pts.push(...linearArcIntersection(seg, otherEl));
        } else if (otherEl.type === 'path') {
          for (let m = 0; m < otherEl.points.length - 1; m++) {
            const seg2 = { type: 'segment', p1: otherEl.points[m], p2: otherEl.points[m + 1] };
            const pt = linearIntersection(seg, seg2);
            if (pt) pts.push(pt);
          }
        }
      }
      return pts;
    }

    function getAllIntersections() {
      const elements = [...conditionGeometry, ...getUserElements()];
      const inters = [];
      for (let i = 0; i < elements.length; i++) {
        for (let j = i + 1; j < elements.length; j++) {
          const e1 = elements[i]; const e2 = elements[j];
          const isLinear1 = ['segment', 'line', 'ruler'].includes(e1.type);
          const isLinear2 = ['segment', 'line', 'ruler'].includes(e2.type);
          
          if (e1.type === 'path') {
            inters.push(...getPathIntersections(e1, e2));
          } else if (e2.type === 'path') {
            inters.push(...getPathIntersections(e2, e1));
          } else if (isLinear1 && isLinear2) {
            const pt = linearIntersection(e1, e2);
            if (pt) inters.push(pt);
          } else if (isLinear1 && e2.type === 'arc') {
            inters.push(...linearArcIntersection(e1, e2));
          } else if (e1.type === 'arc' && isLinear2) {
            inters.push(...linearArcIntersection(e2, e1));
          } else if (e1.type === 'arc' && e2.type === 'arc') {
            inters.push(...arcArcIntersection(e1, e2));
          }
        }
      }
      return inters;
    }

    function getUserElements() { return elements; }

    function getAllPoints() {
      const elements = [...conditionGeometry, ...getUserElements()];
      const pts = [];
      for (const el of elements) {
        if (el.type === 'point') pts.push({ x: el.x, y: el.y, isIntersection: false });
        else if (['segment', 'line', 'ruler'].includes(el.type)) {
          pts.push({ x: el.p1.x, y: el.p1.y, isIntersection: false });
          pts.push({ x: el.p2.x, y: el.p2.y, isIntersection: false });
        } else if (el.type === 'arc' || el.type === 'protractor') {
          pts.push({ x: el.center.x, y: el.center.y, isIntersection: false });
        } else if (el.type === 'path') {
          if (el.points.length > 0) {
            pts.push({ x: el.points[0].x, y: el.points[0].y, isIntersection: false });
            pts.push({ x: el.points[el.points.length - 1].x, y: el.points[el.points.length - 1].y, isIntersection: false });
          }
        }
      }
      const inters = getAllIntersections();
      inters.forEach(p => pts.push({ x: p.x, y: p.y, isIntersection: true }));
      return pts;
    }

    function projectPointToSegment(p, v, w) {
      const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      if (l2 === 0) return { x: v.x, y: v.y };
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
    }

    function projectPointToLine(p, v, w) {
      const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      if (l2 === 0) return { x: v.x, y: v.y };
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      return { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
    }

    function projectPointToArc(p, arc) {
      const cx = arc.center.x, cy = arc.center.y;
      const angle = Math.atan2(p.y - cy, p.x - cx);
      if (isAngleOnArc(angle, arc.startAngle, arc.endAngle)) {
        return { x: cx + arc.radius * Math.cos(angle), y: cy + arc.radius * Math.sin(angle) };
      } else {
        const p1 = { x: cx + arc.radius * Math.cos(arc.startAngle), y: cy + arc.radius * Math.sin(arc.startAngle) };
        const p2 = { x: cx + arc.radius * Math.cos(arc.endAngle), y: cy + arc.radius * Math.sin(arc.endAngle) };
        return (Math.hypot(p.x - p1.x, p.y - p1.y) < Math.hypot(p.x - p2.x, p.y - p2.y)) ? p1 : p2;
      }
    }

    function projectPointToPath(p, points) {
      let minDist = Infinity;
      let bestProj = null;
      for (let i = 0; i < points.length - 1; i++) {
        let proj = projectPointToSegment(p, points[i], points[i + 1]);
        let d = Math.hypot(p.x - proj.x, p.y - proj.y);
        if (d < minDist) { minDist = d; bestProj = proj; }
      }
      return bestProj;
    }

    function findSnapPoint(worldPos) {
      const elements = [...conditionGeometry, ...getUserElements()];
      if (['pan', 'lasso', 'eraser'].includes(currentTool)) return null;
      
      const snapThreshold = 18 / scale; 

      if (currentTool === 'pen') {
        if (globalRuler) {
          let proj = projectPointToLine(worldPos, globalRuler.p1, globalRuler.p2);
          if (Math.hypot(proj.x - worldPos.x, proj.y - worldPos.y) < snapThreshold * 2) {
            return { x: proj.x, y: proj.y, isIntersection: false, isOnLine: true };
          }
        }
        return null;
      }

      let nearestPoint = null;
      let minPointDist = snapThreshold;

      const points = getAllPoints();
      for (const pt of points) {
        const d = Math.hypot(pt.x - worldPos.x, pt.y - worldPos.y);
        if (d < minPointDist) { minPointDist = d; nearestPoint = pt; }
      }

      if (nearestPoint) return nearestPoint;

      let nearestOnLine = null;
      let minLineDist = snapThreshold;

      if (globalRuler) {
        let proj = projectPointToLine(worldPos, globalRuler.p1, globalRuler.p2);
        const d = Math.hypot(proj.x - worldPos.x, proj.y - worldPos.y);
        if (d < minLineDist) {
          minLineDist = d;
          nearestOnLine = { x: proj.x, y: proj.y, isIntersection: false, isOnLine: true };
        }
      }

      for (const el of elements) {
        let proj = null;
        if (el.type === 'segment' || el.type === 'ruler') proj = projectPointToSegment(worldPos, el.p1, el.p2);
        else if (el.type === 'line') proj = projectPointToLine(worldPos, el.p1, el.p2);
        else if (el.type === 'arc') proj = projectPointToArc(worldPos, el);
        else if (el.type === 'path') proj = projectPointToPath(worldPos, el.points);

        if (proj) {
          const d = Math.hypot(proj.x - worldPos.x, proj.y - worldPos.y);
          if (d < minLineDist) {
            minLineDist = d;
            nearestOnLine = { x: proj.x, y: proj.y, isIntersection: false, isOnLine: true };
          }
        }
      }
      return nearestOnLine;
    }

    function isPointInPolygon(p, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i].x, yi = polygon[i].y;
        const xj = polygon[j].x, yj = polygon[j].y;
        const intersect = ((yi > p.y) !== (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function distToSegment(p, v, w) {
      const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function distToInfiniteLine(p, v, w) {
      const num = Math.abs((w.y - v.y) * p.x - (w.x - v.x) * p.y + w.x * v.y - w.y * v.x);
      const den = Math.hypot(w.y - v.y, w.x - v.x);
      return den === 0 ? Math.hypot(p.x - v.x, p.y - v.y) : num / den;
    }

    function findElementAt(worldPos) {
      const threshold = 16 / scale; 
      for (let i = elements.length - 1; i >= 0; i--) {
        const el = elements[i];
        if (el.type === 'point') {
          if (Math.hypot(el.x - worldPos.x, el.y - worldPos.y) <= threshold + 2 / scale) return i;
        } else if (el.type === 'segment' || el.type === 'ruler') {
          if (distToSegment(worldPos, el.p1, el.p2) <= threshold) return i;
        } else if (el.type === 'line') {
          if (distToInfiniteLine(worldPos, el.p1, el.p2) <= threshold) return i;
        } else if (el.type === 'arc') {
          const d = Math.hypot(worldPos.x - el.center.x, worldPos.y - el.center.y);
          if (Math.abs(d - el.radius) <= threshold) {
            const ang = Math.atan2(worldPos.y - el.center.y, worldPos.x - el.center.x);
            if (isAngleOnArc(ang, el.startAngle, el.endAngle)) return i;
          }
        } else if (el.type === 'protractor') {
          if (Math.hypot(el.center.x - worldPos.x, el.center.y - worldPos.y) <= threshold + 10/scale) return i;
        } else if (el.type === 'path') {
          for (let k = 0; k < el.points.length - 1; k++) {
            if (distToSegment(worldPos, el.points[k], el.points[k + 1]) <= threshold) return i;
          }
        } else if (el.type === 'image') {
          if (worldPos.x >= el.x && worldPos.x <= el.x + el.w && worldPos.y >= el.y && worldPos.y <= el.y + el.h) return i;
        }
      }
      return -1;
    }

    function recordState() {
      undoStack.push(JSON.stringify(elements));
      redoStack.length = 0;
    }

    function undo() {
      if (undoStack.length === 0) return;
      redoStack.push(JSON.stringify(elements));
      elements = JSON.parse(undoStack.pop());
      restoreImages(); clearSelection(); render();
    }

    function redo() {
      if (redoStack.length === 0) return;
      undoStack.push(JSON.stringify(elements));
      elements = JSON.parse(redoStack.pop());
      restoreImages(); clearSelection(); render();
    }

    function restoreImages() {
      elements.forEach(el => {
        if (el.type === 'image' && !el.imgObj) {
          const img = new Image(); img.src = el.src; el.imgObj = img;
        }
      });
    }

    function computeSelectionBounds() {
      if (selectedElements.length === 0) return null;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const el of selectedElements) {
        if (el.type === 'point') {
          minX = Math.min(minX, el.x); maxX = Math.max(maxX, el.x);
          minY = Math.min(minY, el.y); maxY = Math.max(maxY, el.y);
        } else if (el.type === 'segment' || el.type === 'line' || el.type === 'ruler') {
          minX = Math.min(minX, el.p1.x, el.p2.x); maxX = Math.max(maxX, el.p1.x, el.p2.x);
          minY = Math.min(minY, el.p1.y, el.p2.y); maxY = Math.max(maxY, el.p1.y, el.p2.y);
        } else if (el.type === 'arc') {
          minX = Math.min(minX, el.center.x - el.radius); maxX = Math.max(maxX, el.center.x + el.radius);
          minY = Math.min(minY, el.center.y - el.radius); maxY = Math.max(maxY, el.center.y + el.radius);
        } else if (el.type === 'protractor') {
          minX = Math.min(minX, el.center.x - el.radius); maxX = Math.max(maxX, el.center.x + el.radius);
          minY = Math.min(minY, el.center.y - el.radius); maxY = Math.max(maxY, el.center.y + el.radius);
        } else if (el.type === 'path') {
          for (const pt of el.points) {
            minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
            minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
          }
        }
      }
      const padding = 12 / scale;
      return { x: minX - padding, y: minY - padding, w: (maxX - minX) + padding * 2, h: (maxY - minY) + padding * 2 };
    }

    function clearSelection() {
      selectedElements = []; selectionBox = null;
      isTransformingSelection = false; transformMode = null;
      selectionRotation = 0;
    }

    function drawGrid() {
      const gridSize = 40;
      const left = -originX / scale; const top = -originY / scale;
      const right = (canvas.width - originX) / scale; const bottom = (canvas.height - originY) / scale;
      const startX = Math.floor(left / gridSize) * gridSize;
      const startY = Math.floor(top / gridSize) * gridSize;
      ctx.save(); ctx.beginPath(); ctx.strokeStyle = '#f3f4f6'; ctx.lineWidth = 1;
      for (let x = startX; x <= right; x += gridSize) { ctx.moveTo(x, top); ctx.lineTo(x, bottom); }
      for (let y = startY; y <= bottom; y += gridSize) { ctx.moveTo(left, y); ctx.lineTo(right, y); }
      ctx.stroke(); ctx.restore();
    }

    function drawInfiniteLine(p1, p2) {
      const dx = p2.x - p1.x; const dy = p2.y - p1.y;
      const d = Math.hypot(dx, dy); if (d === 0) return;
      const ux = dx / d; const uy = dy / d;
      const L = 20000 / scale;
      ctx.beginPath(); ctx.moveTo(p1.x - ux * L, p1.y - uy * L); ctx.lineTo(p1.x + ux * L, p1.y + uy * L); ctx.stroke();
    }

    function drawPoint(x, y, color = '#111827', radius = 4.5) {
      ctx.save(); ctx.fillStyle = color; ctx.beginPath();
      ctx.arc(x, y, radius / scale, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }

    function renderRealisticCompass(center, pencilPos) {
      ctx.save();
      const r = Math.hypot(pencilPos.x - center.x, pencilPos.y - center.y);
      if (r < 1) { ctx.restore(); return; }
      const legLength = Math.max(r * 1.1, 75 / scale);
      const halfR = r / 2;
      const hHinge = Math.sqrt(Math.max(10, legLength * legLength - halfR * halfR));
      const ux = (pencilPos.x - center.x) / r; const uy = (pencilPos.y - center.y) / r;
      const nx = -uy; const ny = ux;
      const midX = (center.x + pencilPos.x) / 2; const midY = (center.y + pencilPos.y) / 2;
      const hingeX = midX + nx * hHinge; const hingeY = midY + ny * hHinge;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.2)'; ctx.shadowBlur = 10 / scale;
      ctx.shadowOffsetX = 3 / scale; ctx.shadowOffsetY = 4 / scale;

      ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 4.5 / scale; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hingeX, hingeY); ctx.lineTo(center.x, center.y); ctx.stroke();
      ctx.strokeStyle = '#374151'; ctx.lineWidth = 2 / scale;
      ctx.beginPath(); ctx.moveTo(center.x + (hingeX - center.x) * 0.15, center.y + (hingeY - center.y) * 0.15); ctx.lineTo(center.x, center.y); ctx.stroke();
      ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 5.5 / scale;
      ctx.beginPath(); ctx.moveTo(hingeX, hingeY); ctx.lineTo(pencilPos.x, pencilPos.y); ctx.stroke();

      const pencilLen = 30 / scale;
      const pTipX = pencilPos.x; const pTipY = pencilPos.y;
      const pBackX = pTipX + (hingeX - pTipX) * (pencilLen / legLength);
      const pBackY = pTipY + (hingeY - pTipY) * (pencilLen / legLength);

      ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 4 / scale;
      ctx.beginPath(); ctx.moveTo(pBackX, pBackY); ctx.lineTo(pTipX, pTipY); ctx.stroke();
      ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.arc(pTipX, pTipY, 2.2 / scale, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#4b5563'; ctx.beginPath(); ctx.arc(hingeX, hingeY, 6.5 / scale, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(hingeX, hingeY, 3 / scale, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#6b7280'; ctx.lineWidth = 3.5 / scale;
      ctx.beginPath(); ctx.moveTo(hingeX, hingeY); ctx.lineTo(hingeX + nx * 14 / scale, hingeY + ny * 14 / scale); ctx.stroke();
      ctx.restore(); ctx.restore();
    }

    function drawRulerElement(p1, p2, color) {
      ctx.strokeStyle = color; ctx.lineWidth = 2 / scale; ctx.setLineDash([5 / scale, 5 / scale]);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); ctx.setLineDash([]);
      drawPoint(p1.x, p1.y, color, 4.5); drawPoint(p2.x, p2.y, color, 4.5);

      const distPx = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const distCm = (distPx / 40).toFixed(1);
      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2;
      
      ctx.save();
      ctx.translate(midX, midY);
      let angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      if (angle > Math.PI / 2 || angle < -Math.PI / 2) angle += Math.PI;
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.font = `bold ${16 / scale}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(`${distCm} cm`, 0, -6 / scale);
      ctx.restore();
    }

    function drawProtractorElement(center, radius, startAngle, endAngle, color) {
      ctx.strokeStyle = color; ctx.lineWidth = 1.5 / scale; ctx.setLineDash([4 / scale, 4 / scale]);
      ctx.beginPath(); ctx.moveTo(center.x, center.y); 
      ctx.lineTo(center.x + radius * Math.cos(startAngle), center.y + radius * Math.sin(startAngle));
      ctx.moveTo(center.x, center.y); 
      ctx.lineTo(center.x + radius * Math.cos(endAngle), center.y + radius * Math.sin(endAngle));
      ctx.stroke(); ctx.setLineDash([]);

      let diff = endAngle - startAngle;
      while (diff <= -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      let ccw = diff < 0;

      ctx.beginPath(); ctx.arc(center.x, center.y, radius, startAngle, endAngle, ccw); ctx.stroke();

      const midAngle = startAngle + diff / 2;
      const textX = center.x + (radius + 24 / scale) * Math.cos(midAngle);
      const textY = center.y + (radius + 24 / scale) * Math.sin(midAngle);
      const deg = Math.abs(diff * 180 / Math.PI).toFixed(1);

      ctx.fillStyle = color;
      ctx.font = `bold ${16 / scale}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`${deg}°`, textX, textY);
      
      drawPoint(center.x, center.y, color, 5);
    }

    function drawUnmarkedRulerPreview(p1, p2) {
      const dx = p2.x - p1.x; const dy = p2.y - p1.y;
      const dist = Math.hypot(dx, dy);
      if (dist === 0) return;
      const angle = Math.atan2(dy, dx);
      
      ctx.save();
      ctx.translate(p1.x, p1.y);
      ctx.rotate(angle);
      
      const L = 10000 / scale;
      const thickness = 40 / scale;
      
      ctx.fillStyle = 'rgba(230, 210, 180, 0.3)';
      ctx.fillRect(-L, 0, 2 * L, thickness);
      
      ctx.strokeStyle = 'rgba(139, 90, 43, 0.4)';
      ctx.lineWidth = 2 / scale;
      ctx.beginPath();
      ctx.moveTo(-L, 0); ctx.lineTo(L, 0);
      ctx.moveTo(-L, thickness); ctx.lineTo(L, thickness);
      ctx.stroke();

      ctx.beginPath();
      for(let x = -Math.floor(L/40)*40; x < L; x += 40) {
         ctx.moveTo(x, 0);
         ctx.lineTo(x, (x % 200 === 0) ? 12/scale : 6/scale);
      }
      ctx.stroke();
      
      ctx.restore();
      
      drawPoint(p1.x, p1.y, 'rgba(37, 99, 235, 0.6)', 4.5);
      drawPoint(p2.x, p2.y, 'rgba(37, 99, 235, 0.6)', 4.5);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save(); ctx.translate(originX, originY); ctx.scale(scale, scale);
      drawGrid();

      drawConditionLabels();
      for (const el of [...conditionGeometry, ...elements]) {
        ctx.strokeStyle = el.color || '#374151'; ctx.fillStyle = el.color || '#1f2937'; 
        ctx.lineWidth = (el.lineWidth || 1.8) / scale; 
        
        if (el.type === 'image') {
          if (el.imgObj && el.imgObj.complete) ctx.drawImage(el.imgObj, el.x, el.y, el.w, el.h);
          if (selectedImage === el) {
            ctx.save(); ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 1.5 / scale; ctx.strokeRect(el.x, el.y, el.w, el.h);
            ctx.fillStyle = '#2563eb'; ctx.fillRect(el.x + el.w - 5 / scale, el.y + el.h - 5 / scale, 10 / scale, 10 / scale); ctx.restore();
          }
        } else if (el.type === 'point') {
          drawPoint(el.x, el.y, el.color || '#111827', 4.5);
        } else if (el.type === 'segment') {
          ctx.beginPath(); ctx.moveTo(el.p1.x, el.p1.y); ctx.lineTo(el.p2.x, el.p2.y); ctx.stroke();
          if (!el.hideStartPoint) drawPoint(el.p1.x, el.p1.y, el.color);
          if (!el.hideEndPoint) drawPoint(el.p2.x, el.p2.y, el.color);
        } else if (el.type === 'line') {
          drawInfiniteLine(el.p1, el.p2);
          drawPoint(el.p1.x, el.p1.y, el.color); drawPoint(el.p2.x, el.p2.y, el.color);
        } else if (el.type === 'arc') {
          ctx.beginPath(); ctx.arc(el.center.x, el.center.y, el.radius, el.startAngle, el.endAngle, false); ctx.stroke();
          drawPoint(el.center.x, el.center.y, el.color);
        } else if (el.type === 'path') {
          if (el.points.length > 1) {
            ctx.beginPath(); ctx.moveTo(el.points[0].x, el.points[0].y);
            for (let i = 1; i < el.points.length; i++) ctx.lineTo(el.points[i].x, el.points[i].y);
            ctx.stroke();
          }
        } else if (el.type === 'ruler') {
          drawRulerElement(el.p1, el.p2, el.color);
        } else if (el.type === 'protractor') {
          drawProtractorElement(el.center, el.radius, el.startAngle, el.endAngle, el.color);
        }
      }

      if (currentTool === 'pen' && isDrawingPen && currentPath.length > 1) {
        ctx.strokeStyle = currentColor; ctx.lineWidth = 2 / scale;
        ctx.beginPath(); ctx.moveTo(currentPath[0].x, currentPath[0].y);
        for (let i = 1; i < currentPath.length; i++) ctx.lineTo(currentPath[i].x, currentPath[i].y);
        ctx.stroke();
      }

      const activePos = activeSnapPoint || mouseWorld;

      if ((currentTool === 'segment' || currentTool === 'ruler') && isDrawingLinear && linearStart) {
        const targetPos = getOrthoTarget(linearStart, activePos);
        if (currentTool === 'ruler') {
          drawRulerElement(linearStart, targetPos, currentColor);
        } else {
          ctx.strokeStyle = currentColor; ctx.lineWidth = 2 / scale;
          ctx.beginPath(); ctx.moveTo(linearStart.x, linearStart.y); ctx.lineTo(targetPos.x, targetPos.y); ctx.stroke();
          drawPoint(linearStart.x, linearStart.y, currentColor);
        }
      }

      if (currentTool === 'line' && isDrawingLinear && linearStart) {
        const targetPos = getOrthoTarget(linearStart, activePos);
        ctx.strokeStyle = currentColor; ctx.lineWidth = 2 / scale;
        drawInfiniteLine(linearStart, targetPos);
        drawPoint(linearStart.x, linearStart.y, currentColor);
      }

      if (globalRuler) {
        drawUnmarkedRulerPreview(globalRuler.p1, globalRuler.p2);
      } else if (currentTool === 'unmarked-ruler' && globalRulerP1) {
        const targetOrtho = getOrthoTarget(globalRulerP1, activePos);
        drawUnmarkedRulerPreview(globalRulerP1, targetOrtho);
      }

      if (currentTool === 'compass') {
        if (compassStep === 0) {
          drawPoint(activePos.x, activePos.y, '#2563eb', 5);
        } else if (compassStep === 1 && compassInitialCenter) {
          ctx.save(); ctx.strokeStyle = 'rgba(37, 99, 235, 0.4)'; ctx.setLineDash([4 / scale, 4 / scale]);
          ctx.beginPath(); ctx.moveTo(compassInitialCenter.x, compassInitialCenter.y); ctx.lineTo(activePos.x, activePos.y); ctx.stroke();
          const r = Math.hypot(activePos.x - compassInitialCenter.x, activePos.y - compassInitialCenter.y);
          ctx.beginPath(); ctx.arc(compassInitialCenter.x, compassInitialCenter.y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
          drawPoint(compassInitialCenter.x, compassInitialCenter.y, '#2563eb', 4.5); 
          renderRealisticCompass(compassInitialCenter, activePos);
        } else if (compassStep === 2 && compassRadius > 0) {
          const curCenter = compassCenter || activePos;
          ctx.save(); ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 1.6 / scale; ctx.setLineDash([6 / scale, 4 / scale]);
          ctx.beginPath(); ctx.arc(curCenter.x, curCenter.y, compassRadius, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
          drawPoint(curCenter.x, curCenter.y, '#2563eb', 5);
          
          const pencilP = { x: curCenter.x + compassRadius, y: curCenter.y };
          renderRealisticCompass(curCenter, pencilP);
        } else if (compassStep >= 3 && compassCenter) {
          ctx.save(); ctx.strokeStyle = 'rgba(156, 163, 175, 0.5)'; ctx.setLineDash([4 / scale, 4 / scale]);
          ctx.beginPath(); ctx.arc(compassCenter.x, compassCenter.y, compassRadius, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
          drawPoint(compassCenter.x, compassCenter.y, '#2563eb', 4.5);
          if (compassStep === 3) {
            const currentAngle = Math.atan2(activePos.y - compassCenter.y, activePos.x - compassCenter.x);
            const pencilP = {
              x: compassCenter.x + compassRadius * Math.cos(currentAngle),
              y: compassCenter.y + compassRadius * Math.sin(currentAngle)
            };
            renderRealisticCompass(compassCenter, pencilP);
          } else if (compassStep === 4) {
            ctx.save(); ctx.strokeStyle = currentColor; ctx.lineWidth = 2.2 / scale; ctx.beginPath();
            const ccw = compassDrawEndAngle < compassDrawStartAngle;
            ctx.arc(compassCenter.x, compassCenter.y, compassRadius, compassDrawStartAngle, compassDrawEndAngle, ccw);
            ctx.stroke(); ctx.restore();
            const pencilP = {
              x: compassCenter.x + compassRadius * Math.cos(compassDrawEndAngle),
              y: compassCenter.y + compassRadius * Math.sin(compassDrawEndAngle)
            };
            renderRealisticCompass(compassCenter, pencilP);
          }
        }
      }

      if (currentTool === 'protractor') {
        if (protractorStep === 0) {
          drawPoint(activePos.x, activePos.y, '#10b981', 5);
        } else if (protractorStep === 1 && protractorCenter) {
          ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)'; ctx.setLineDash([4 / scale, 4 / scale]);
          ctx.beginPath(); ctx.moveTo(protractorCenter.x, protractorCenter.y); ctx.lineTo(activePos.x, activePos.y); ctx.stroke();
          ctx.setLineDash([]);
          drawPoint(protractorCenter.x, protractorCenter.y, '#10b981', 4.5);
          drawPoint(activePos.x, activePos.y, '#10b981', 4.5);
        } else if (protractorStep === 2 && protractorCenter) {
          drawProtractorElement(protractorCenter, protractorRadius, protractorStartAngle, protractorCurrentAngle, currentColor);
        }
      }

      if (currentTool === 'lasso' && isSelectingLasso && lassoPolygon.length > 1) {
        ctx.save(); ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 1.5 / scale; ctx.setLineDash([4 / scale, 4 / scale]);
        ctx.beginPath(); ctx.moveTo(lassoPolygon[0].x, lassoPolygon[0].y);
        for (let i = 1; i < lassoPolygon.length; i++) ctx.lineTo(lassoPolygon[i].x, lassoPolygon[i].y);
        ctx.stroke(); ctx.fillStyle = 'rgba(37, 99, 235, 0.08)'; ctx.fill(); ctx.restore();
      }

      if (selectionBox && selectedElements.length > 0) {
        ctx.save();
        let bx = selectionBox.x, by = selectionBox.y, bw = selectionBox.w, bh = selectionBox.h;
        if (transformMode === 'rotate' && transformCenter) {
            ctx.translate(transformCenter.x, transformCenter.y); ctx.rotate(selectionRotation); ctx.translate(-transformCenter.x, -transformCenter.y);
            bx = originalSelectedBounds.x; by = originalSelectedBounds.y; bw = originalSelectedBounds.w; bh = originalSelectedBounds.h;
        }
        ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 1.5 / scale; ctx.setLineDash([4 / scale, 4 / scale]);
        ctx.strokeRect(bx, by, bw, bh); ctx.setLineDash([]);
        const hSize = 8 / scale; 
        ctx.fillStyle = '#2563eb'; ctx.fillRect(bx + bw - hSize / 2, by + bh - hSize / 2, hSize, hSize);
        const rotHandleX = bx + bw / 2, rotHandleY = by - 24 / scale; 
        ctx.beginPath(); ctx.moveTo(bx + bw / 2, by); ctx.lineTo(rotHandleX, rotHandleY); ctx.stroke();
        ctx.beginPath(); ctx.arc(rotHandleX, rotHandleY, 6 / scale, 0, Math.PI * 2); ctx.fillStyle = '#10b981'; ctx.fill(); ctx.stroke();
        ctx.restore();
      }

      if (currentTool === 'eraser') {
        const hoverIdx = findElementAt(mouseWorld);
        if (hoverIdx !== -1) {
          ctx.save(); ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4 / scale; const el = elements[hoverIdx];
          if (el.type === 'point') drawPoint(el.x, el.y, '#ef4444', 6);
          else if (el.type === 'segment') { ctx.beginPath(); ctx.moveTo(el.p1.x, el.p1.y); ctx.lineTo(el.p2.x, el.p2.y); ctx.stroke(); }
          else if (el.type === 'line') drawInfiniteLine(el.p1, el.p2);
          else if (el.type === 'arc') { ctx.beginPath(); ctx.arc(el.center.x, el.center.y, el.radius, el.startAngle, el.endAngle, false); ctx.stroke(); }
          else if (el.type === 'ruler') { ctx.beginPath(); ctx.moveTo(el.p1.x, el.p1.y); ctx.lineTo(el.p2.x, el.p2.y); ctx.stroke(); }
          else if (el.type === 'protractor') { ctx.beginPath(); ctx.arc(el.center.x, el.center.y, el.radius, 0, Math.PI * 2); ctx.stroke(); }
          else if (el.type === 'image') ctx.strokeRect(el.x, el.y, el.w, el.h);
          else if (el.type === 'path') {
            ctx.beginPath(); ctx.moveTo(el.points[0].x, el.points[0].y);
            for (let i = 1; i < el.points.length; i++) ctx.lineTo(el.points[i].x, el.points[i].y);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      if (activeSnapPoint && !['pan', 'lasso', 'eraser'].includes(currentTool)) {
        ctx.save();
        if (activeSnapPoint.isIntersection) {
          ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2 / scale; ctx.beginPath(); ctx.arc(activeSnapPoint.x, activeSnapPoint.y, 8 / scale, 0, Math.PI * 2); ctx.stroke();
          const crossSize = 11 / scale; ctx.beginPath(); ctx.moveTo(activeSnapPoint.x - crossSize, activeSnapPoint.y); ctx.lineTo(activeSnapPoint.x + crossSize, activeSnapPoint.y);
          ctx.moveTo(activeSnapPoint.x, activeSnapPoint.y - crossSize); ctx.lineTo(activeSnapPoint.x, activeSnapPoint.y + crossSize); ctx.stroke();
          ctx.fillStyle = 'rgba(239, 68, 68, 0.2)'; ctx.beginPath(); ctx.arc(activeSnapPoint.x, activeSnapPoint.y, 8 / scale, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.strokeStyle = currentColor; ctx.lineWidth = 2 / scale; ctx.beginPath(); ctx.arc(activeSnapPoint.x, activeSnapPoint.y, 8 / scale, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = 'rgba(37, 99, 235, 0.2)'; ctx.beginPath(); ctx.arc(activeSnapPoint.x, activeSnapPoint.y, 8 / scale, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
      ctx.restore();
    }

    function cancelCurrentAction() {
      isDrawingLinear = false; linearStart = null;
      isDrawingPen = false; currentPath = [];
      isPanning = false; isDraggingImage = false; isResizingImage = false;
      if (isSelectingLasso) { isSelectingLasso = false; lassoPolygon = []; }
      if (isTransformingSelection) { isTransformingSelection = false; }
    }

    const quickEraserBtn = document.getElementById('quick-eraser-btn');
    quickEraserBtn.style.display = 'none';

    function checkPenButton(e) {
      const isEraserButton = (e.buttons & 2) || (e.buttons & 32);
      
      if (isEraserButton && !tempEraserMode) {
        cancelCurrentAction();
        tempEraserMode = true;
        buttonTriggeredEraser = true;
        savedTool = currentTool;
        currentTool = 'eraser';
        
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        const eraserBtn = document.getElementById('btn-eraser');
        if (eraserBtn) eraserBtn.classList.add('active');
        
        canvas.style.cursor = 'pointer';
        updateStatus('임시 지우개 모드: 측면 버튼을 떼면 원래 도구로 돌아갑니다.');
      } 
      else if (!isEraserButton && tempEraserMode) {
        tempEraserMode = false;
        buttonTriggeredEraser = false;
        currentTool = savedTool;
        
        document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
        const restoredBtn = document.getElementById('btn-' + currentTool);
        if (restoredBtn) restoredBtn.classList.add('active');
        
        if (currentTool === 'pan') { canvas.style.cursor = 'default'; updateStatus('포인터 모드: 배치된 이미지 조작 (화면 배율 고정)'); }
        else if (currentTool === 'lasso') { canvas.style.cursor = 'crosshair'; updateStatus('올가미: 영역을 둘러싸 선택하세요.'); }
        else if (currentTool === 'eraser') { canvas.style.cursor = 'pointer'; updateStatus('지우개: 지울 요소를 터치하세요.'); }
        else if (currentTool === 'pen') { canvas.style.cursor = 'crosshair'; updateStatus(globalRuler ? '자유 곡선 펜 (자 배치됨): 자 근처에서 그리면 직선이 그어집니다.' : '자유 곡선 펜: 자유롭게 그리세요.'); }
        else if (currentTool === 'point') { canvas.style.cursor = 'crosshair'; updateStatus('점 찍기: 화면을 터치하여 점을 찍으세요.'); }
        else if (currentTool === 'segment') { canvas.style.cursor = 'crosshair'; updateStatus('선분 작도: 시작점부터 드래그하세요.'); }
        else if (currentTool === 'line') { canvas.style.cursor = 'crosshair'; updateStatus('직선 작도: 두 점을 지나는 직선을 그립니다.'); }
        else if (currentTool === 'compass') { canvas.style.cursor = 'crosshair'; updateStatus('컴퍼스 [1단계]: 바늘을 꽂을 중심점을 터치하세요.'); }
        else if (currentTool === 'ruler') { canvas.style.cursor = 'crosshair'; updateStatus('자(길이 측정): 측정할 선을 드래그하세요.'); }
        else if (currentTool === 'unmarked-ruler') { canvas.style.cursor = 'crosshair'; updateStatus('눈금 없는 자: 두 번째 기준점을 터치하세요.'); }
        else if (currentTool === 'protractor') { canvas.style.cursor = 'crosshair'; updateStatus('각도기: 이어서 측정할 수 있습니다.'); }
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      activePointers.set(e.pointerId, e);

      checkPenButton(e);

      if (activePointers.size > 1) { cancelCurrentAction(); return; }

      const rawWorld = screenToWorld(e.clientX, e.clientY);
      if (!inDrawingRegion(rawWorld)) return;
      mouseWorld = rawWorld;
      activeSnapPoint = findSnapPoint(rawWorld);
      const targetPos = activeSnapPoint || rawWorld;

      if (currentTool === 'pan') {
        let hit = null;
        for (let i = elements.length - 1; i >= 0; i--) {
          const el = elements[i];
          if (el.type === 'image') {
            const handleDist = Math.hypot(rawWorld.x - (el.x + el.w), rawWorld.y - (el.y + el.h));
            if (handleDist <= 12 / scale) { selectedImage = el; isResizingImage = true; return; }
            if (rawWorld.x >= el.x && rawWorld.x <= el.x + el.w && rawWorld.y >= el.y && rawWorld.y <= el.y + el.h) { hit = el; break; }
          }
        }
        if (hit) {
          recordState(); selectedImage = hit; isDraggingImage = true;
          dragOffset = { x: rawWorld.x - hit.x, y: rawWorld.y - hit.y };
          render(); return;
        }
        selectedImage = null; isPanning = false;
        panStartX = e.clientX - originX; panStartY = e.clientY - originY;
      }
      else if (currentTool === 'eraser') {
        const hitIdx = findElementAt(rawWorld);
        if (hitIdx !== -1) { recordState(); elements.splice(hitIdx, 1); render(); }
      }
      else if (currentTool === 'lasso') {
        if (selectionBox) {
          const cx = selectionBox.x + selectionBox.w / 2; const cy = selectionBox.y + selectionBox.h / 2;
          const rotHandleX = cx; const rotHandleY = selectionBox.y - 24 / scale;
          if (Math.hypot(rawWorld.x - rotHandleX, rawWorld.y - rotHandleY) <= 12 / scale) {
            recordState(); isTransformingSelection = true; transformMode = 'rotate';
            transformStartMouse = { ...rawWorld }; originalSelectedBounds = { ...selectionBox };
            initialElementsState = JSON.parse(JSON.stringify(selectedElements));
            transformCenter = { x: cx, y: cy }; transformStartAngle = Math.atan2(rawWorld.y - cy, rawWorld.x - cx);
            selectionRotation = 0; return;
          }
          const handleX = selectionBox.x + selectionBox.w; const handleY = selectionBox.y + selectionBox.h;
          if (Math.hypot(rawWorld.x - handleX, rawWorld.y - handleY) <= 12 / scale) {
            recordState(); isTransformingSelection = true; transformMode = 'resize';
            transformStartMouse = { ...rawWorld }; originalSelectedBounds = { ...selectionBox };
            initialElementsState = JSON.parse(JSON.stringify(selectedElements)); return;
          }
          if (rawWorld.x >= selectionBox.x && rawWorld.x <= selectionBox.x + selectionBox.w && rawWorld.y >= selectionBox.y && rawWorld.y <= selectionBox.y + selectionBox.h) {
            recordState(); isTransformingSelection = true; transformMode = 'move';
            transformStartMouse = { ...rawWorld }; originalSelectedBounds = { ...selectionBox };
            initialElementsState = JSON.parse(JSON.stringify(selectedElements)); return;
          }
        }
        clearSelection(); isSelectingLasso = true; lassoPolygon = [rawWorld];
      }
      else if (currentTool === 'pen') { 
        isDrawingPen = true; 
        currentPath = [activeSnapPoint || rawWorld]; 
      }
      else if (currentTool === 'point') { recordState(); elements.push({ type: 'point', x: targetPos.x, y: targetPos.y, color: currentColor }); render(); }
      else if (currentTool === 'segment' || currentTool === 'line' || currentTool === 'ruler') { isDrawingLinear = true; linearStart = targetPos; }
      else if (currentTool === 'unmarked-ruler') {
        if (!globalRulerP1) {
          globalRulerP1 = { ...targetPos }; 
          updateStatus('눈금 없는 자 [2단계]: 자를 놓을 두 번째 기준점을 터치하세요.'); render();
        } else {
          const targetOrtho = getOrthoTarget(globalRulerP1, targetPos);
          const r = Math.hypot(targetOrtho.x - globalRulerP1.x, targetOrtho.y - globalRulerP1.y);
          if (r > 3 / scale) {
            globalRuler = { p1: globalRulerP1, p2: targetOrtho };
            globalRulerP1 = null;
            setActiveTool('pen'); 
            updateStatus('자가 배치되었습니다. 펜으로 자를 따라 그려보세요. (자 버튼을 한 번 더 누르면 사라집니다)');
          }
        }
      }
      else if (currentTool === 'compass') {
        if (compassStep === 0) {
          compassInitialCenter = { ...targetPos }; compassStep = 1;
          updateStatus('컴퍼스 [2단계]: 반지름을 지정할 점을 터치하세요.'); render();
        } else if (compassStep === 1) {
          const r = Math.hypot(targetPos.x - compassInitialCenter.x, targetPos.y - compassInitialCenter.y);
          if (r > 3 / scale) {
            compassRadius = r; compassStep = 2; compassCenter = { ...targetPos }; 
            updateStatus('컴퍼스 [3단계]: 펜을 움직여 중심을 정하고 눌러서 바늘을 고정하세요.'); render();
          }
        } else if (compassStep === 2) {
          compassCenter = { ...targetPos }; compassStep = 3;
          updateStatus('컴퍼스 [4단계]: 호를 그릴 시작점부터 드래그하세요.'); render();
        } else if (compassStep === 3) {
          compassDrawStartAngle = Math.atan2(targetPos.y - compassCenter.y, targetPos.x - compassCenter.x);
          compassDrawEndAngle = compassDrawStartAngle; compassCurrentAngle = compassDrawStartAngle;
          compassStep = 4; updateStatus('컴퍼스 [4단계]: 펜을 드래그하여 호를 완성하세요.'); render();
        }
      }
      else if (currentTool === 'protractor') {
        if (protractorStep === 0) {
          protractorCenter = { ...targetPos }; protractorStep = 1;
          updateStatus('각도기 [2단계]: 각도의 시작선(한 변)이 될 점을 터치하세요.'); render();
        } else if (protractorStep === 1) {
          const r = Math.hypot(targetPos.x - protractorCenter.x, targetPos.y - protractorCenter.y);
          if (r > 3 / scale) {
            protractorRadius = r; protractorStartAngle = Math.atan2(targetPos.y - protractorCenter.y, targetPos.x - protractorCenter.x);
            protractorCurrentAngle = protractorStartAngle; protractorStep = 2;
            updateStatus('각도기 [3단계]: 펜을 움직여 각도를 측정하고 화면을 눌러 확정하세요.'); render();
          }
        } else if (protractorStep === 2) {
          protractorCurrentAngle = Math.atan2(targetPos.y - protractorCenter.y, targetPos.x - protractorCenter.x);
          let diff = Math.abs(protractorCurrentAngle - protractorStartAngle);
          if (diff > 0.01) {
            recordState();
            elements.push({
              type: 'protractor', center: { ...protractorCenter }, radius: protractorRadius,
              startAngle: protractorStartAngle, endAngle: protractorCurrentAngle, color: currentColor
            });
          }
          protractorStep = 0; updateStatus('각도기 [1단계]: 각도의 중심점(꼭짓점)을 터치하세요.'); render();
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (activePointers.has(e.pointerId)) {
        activePointers.set(e.pointerId, e);
      }

      checkPenButton(e);

      if (activePointers.size > 1) return;
      const rect = canvas.getBoundingClientRect();
      if (!activePointers.has(e.pointerId) && (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom)) return;

      mouseWorld = screenToWorld(e.clientX, e.clientY);
      activeSnapPoint = findSnapPoint(mouseWorld);
      if (!inDrawingRegion(mouseWorld)) {
        if (isDrawingPen && currentPath.length > 1) {
          recordState(); elements.push({type:'path',points:currentPath,color:currentColor,lineWidth:2}); currentPath=[];
        }
        render(); return;
      }

      const isTouching = activePointers.has(e.pointerId);
      if (currentTool === 'eraser' && isTouching) {
        const hitIdx = findElementAt(mouseWorld);
        if (hitIdx !== -1) { recordState(); elements.splice(hitIdx, 1); }
      }

      if (currentTool === 'pan') {
        if (isPanning) { originX = e.clientX - panStartX; originY = e.clientY - panStartY; render(); return; }
        if (isDraggingImage && selectedImage) { selectedImage.x = mouseWorld.x - dragOffset.x; selectedImage.y = mouseWorld.y - dragOffset.y; render(); return; }
        if (isResizingImage && selectedImage) { selectedImage.w = Math.max(20, mouseWorld.x - selectedImage.x); selectedImage.h = Math.max(20, mouseWorld.y - selectedImage.y); render(); return; }
      }

      if (currentTool === 'compass') {
        if (compassStep === 1 || compassStep === 2) {
          if (compassStep === 2) compassCenter = { ...activeSnapPoint || mouseWorld }; 
          render(); return;
        }
        if (compassStep === 3 || compassStep === 4) {
          const currentAngle = Math.atan2(mouseWorld.y - compassCenter.y, mouseWorld.x - compassCenter.x);
          let diff = currentAngle - compassDrawEndAngle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          compassDrawEndAngle += diff; compassCurrentAngle = currentAngle; render(); return;
        }
      }

      if (currentTool === 'unmarked-ruler') {
        if (globalRulerP1) { render(); return; }
      }

      if (currentTool === 'protractor') {
        if (protractorStep === 1) { render(); return; }
        if (protractorStep === 2) {
          protractorCurrentAngle = Math.atan2(mouseWorld.y - protractorCenter.y, mouseWorld.x - protractorCenter.x);
          render(); return;
        }
      }

      if (currentTool === 'lasso') {
        if (isSelectingLasso) { lassoPolygon.push(mouseWorld); render(); return; }
        if (isTransformingSelection && transformStartMouse) {
          const dx = mouseWorld.x - transformStartMouse.x; const dy = mouseWorld.y - transformStartMouse.y;
          if (transformMode === 'move') {
            selectionBox.x = originalSelectedBounds.x + dx; selectionBox.y = originalSelectedBounds.y + dy;
            for (let i = 0; i < selectedElements.length; i++) {
              const el = selectedElements[i]; const init = initialElementsState[i];
              if (el.type === 'point') { el.x = init.x + dx; el.y = init.y + dy; }
              else if (el.type === 'segment' || el.type === 'line' || el.type === 'ruler') { el.p1.x = init.p1.x + dx; el.p1.y = init.p1.y + dy; el.p2.x = init.p2.x + dx; el.p2.y = init.p2.y + dy; }
              else if (el.type === 'arc' || el.type === 'protractor') { el.center.x = init.center.x + dx; el.center.y = init.center.y + dy; }
              else if (el.type === 'path') { el.points = init.points.map(p => ({ x: p.x + dx, y: p.y + dy })); }
            }
          } else if (transformMode === 'resize') {
            const originCornerX = originalSelectedBounds.x; const originCornerY = originalSelectedBounds.y;
            const newW = Math.max(20, originalSelectedBounds.w + dx); const scaleFactor = newW / originalSelectedBounds.w;
            selectionBox.w = newW; selectionBox.h = originalSelectedBounds.h * scaleFactor;
            for (let i = 0; i < selectedElements.length; i++) {
              const el = selectedElements[i]; const init = initialElementsState[i];
              if (el.type === 'point') { el.x = originCornerX + (init.x - originCornerX) * scaleFactor; el.y = originCornerY + (init.y - originCornerY) * scaleFactor; }
              else if (el.type === 'segment' || el.type === 'line' || el.type === 'ruler') { el.p1.x = originCornerX + (init.p1.x - originCornerX) * scaleFactor; el.p1.y = originCornerY + (init.p1.y - originCornerY) * scaleFactor; el.p2.x = originCornerX + (init.p2.x - originCornerX) * scaleFactor; el.p2.y = originCornerY + (init.p2.y - originCornerY) * scaleFactor; }
              else if (el.type === 'arc' || el.type === 'protractor') { el.center.x = originCornerX + (init.center.x - originCornerX) * scaleFactor; el.center.y = originCornerY + (init.center.y - originCornerY) * scaleFactor; el.radius = init.radius * scaleFactor; }
              else if (el.type === 'path') { el.points = init.points.map(p => ({ x: originCornerX + (p.x - originCornerX) * scaleFactor, y: originCornerY + (p.y - originCornerY) * scaleFactor })); }
            }
          } else if (transformMode === 'rotate') {
            const currentAngle = Math.atan2(mouseWorld.y - transformCenter.y, mouseWorld.x - transformCenter.x);
            selectionRotation = currentAngle - transformStartAngle;
            for (let i = 0; i < selectedElements.length; i++) {
                const el = selectedElements[i]; const init = initialElementsState[i];
                const cx = transformCenter.x; const cy = transformCenter.y; const angle = selectionRotation;
                const rotatePt = (pt) => {
                    const dxPt = pt.x - cx; const dyPt = pt.y - cy;
                    return { x: cx + dxPt * Math.cos(angle) - dyPt * Math.sin(angle), y: cy + dxPt * Math.sin(angle) + dyPt * Math.cos(angle) };
                };
                if (el.type === 'point') { const p = rotatePt(init); el.x = p.x; el.y = p.y; }
                else if (el.type === 'segment' || el.type === 'line' || el.type === 'ruler') { el.p1 = rotatePt(init.p1); el.p2 = rotatePt(init.p2); }
                else if (el.type === 'arc' || el.type === 'protractor') { el.center = rotatePt(init.center); el.startAngle = init.startAngle + angle; el.endAngle = init.endAngle + angle; }
                else if (el.type === 'path') { el.points = init.points.map(p => rotatePt(p)); }
            }
          }
          render(); return;
        }
      }

      if (currentTool === 'pen' && isDrawingPen) { currentPath.push(activeSnapPoint || mouseWorld); render(); return; }

      render();
    });

    const handlePointerUp = (e) => {
      if (!activePointers.has(e.pointerId)) return;
      mouseWorld = screenToWorld(e.clientX, e.clientY);
      activeSnapPoint = findSnapPoint(mouseWorld);
      activePointers.delete(e.pointerId);
      
      const wasEraser = tempEraserMode; 
      checkPenButton(e); 

      if (activePointers.size > 0) return;

      if (wasEraser) {
        render();
        return; 
      }

      const targetPos = activeSnapPoint || mouseWorld;

      if (currentTool === 'pan') {
        isPanning = false; isDraggingImage = false; isResizingImage = false;
      }
      else if (currentTool === 'unmarked-ruler' && isDrawingLinear) {
        isDrawingLinear = false;
        const finalPos = projectPointToLine(targetPos, unmarkedRulerP1, unmarkedRulerP2);
        const dist = Math.hypot(finalPos.x - linearStart.x, finalPos.y - linearStart.y);
        if (dist > 3 / scale) {
          recordState();
          elements.push({ type: 'segment', p1: linearStart, p2: { x: finalPos.x, y: finalPos.y }, color: currentColor });
        }
        linearStart = null; render();
      }
      else if (currentTool === 'compass' && compassStep === 4) {
        const angleDiff = Math.abs(compassDrawEndAngle - compassDrawStartAngle);
        if (angleDiff > 0.05) {
          recordState();
          elements.push({
            type: 'arc', center: { ...compassCenter }, radius: compassRadius,
            startAngle: Math.min(compassDrawStartAngle, compassDrawEndAngle),
            endAngle: Math.max(compassDrawStartAngle, compassDrawEndAngle), color: currentColor
          });
        }
        compassStep = 0; 
        compassInitialCenter = null; 
        compassCenter = null; 
        compassRadius = 0;
        updateStatus('컴퍼스 [1단계]: 바늘을 꽂을 중심점을 터치하세요.'); 
        render();
      }
      else if (currentTool === 'lasso') {
        if (isSelectingLasso) {
          isSelectingLasso = false;
          if (lassoPolygon.length > 2) {
            selectedElements = elements.filter(el => {
              if (el.type === 'point') return isPointInPolygon(el, lassoPolygon);
              if (el.type === 'segment' || el.type === 'line' || el.type === 'ruler') return isPointInPolygon(el.p1, lassoPolygon) || isPointInPolygon(el.p2, lassoPolygon);
              if (el.type === 'arc' || el.type === 'protractor') return isPointInPolygon(el.center, lassoPolygon);
              if (el.type === 'path') return el.points.some(p => isPointInPolygon(p, lassoPolygon));
              return false;
            });
            if (selectedElements.length > 0) {
              selectionBox = computeSelectionBounds();
              updateStatus('올가미: 영역을 이동, 회전, 크기 조절을 할 수 있습니다.');
            } else { clearSelection(); updateStatus('올가미: 선택된 요소가 없습니다.'); }
          }
          lassoPolygon = []; render();
        }
        if (isTransformingSelection) {
          isTransformingSelection = false;
          if (['rotate', 'resize', 'move'].includes(transformMode)) { selectionBox = computeSelectionBounds(); }
          transformMode = null; transformStartMouse = null; selectionRotation = 0; transformCenter = null; render();
        }
      }
      else if (currentTool === 'pen' && isDrawingPen) {
        isDrawingPen = false;
        if (currentPath.length > 1) { recordState(); elements.push({ type: 'path', points: currentPath, color: currentColor, lineWidth: 2 }); }
        currentPath = []; render();
      }
      else if ((currentTool === 'segment' || currentTool === 'line' || currentTool === 'ruler') && isDrawingLinear) {
        isDrawingLinear = false;
        const finalPos = getOrthoTarget(linearStart, targetPos);
        const dist = Math.hypot(finalPos.x - linearStart.x, finalPos.y - linearStart.y);
        
        if (dist > 3 / scale) { 
          recordState(); 
          elements.push({ type: currentTool, p1: linearStart, p2: { x: finalPos.x, y: finalPos.y }, color: currentColor }); 
        }
        linearStart = null; render();
      }
    };

    window.addEventListener('pointerup', handlePointerUp);
    window.addEventListener('pointercancel', e => {
      activePointers.delete(e.pointerId);
      cancelCurrentAction();
      render();
    });


    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { 
        e.preventDefault(); 
        if (globalRuler || currentTool === 'unmarked-ruler') {
          globalRuler = null; globalRulerP1 = null; 
          setActiveTool('pan'); 
          updateStatus('눈금 없는 자가 화면에서 치워졌습니다.');
        } else { 
          setActiveTool('pan'); 
        }
        return; 
      }
      if (e.ctrlKey || e.metaKey) {
        const key = e.key.toLowerCase();
        if (key === 'z') { if (e.shiftKey) redo(); else undo(); e.preventDefault(); }
        else if (key === 'y') { redo(); e.preventDefault(); }
      }
    });

    colorPicker.addEventListener('input', (e) => { currentColor = e.target.value; });

    function handleImageFile(file, posX, posY) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          recordState();
          const targetWidth = Math.min(img.width, 400);
          const targetHeight = (img.height / img.width) * targetWidth;
          const centerPos = posX !== undefined ? screenToWorld(posX, posY) : { x: (canvas.width / 2 - originX) / scale - targetWidth / 2, y: (canvas.height / 2 - originY) / scale - targetHeight / 2 };
          const imgData = { type: 'image', src: event.target.result, x: centerPos.x, y: centerPos.y, w: targetWidth, h: targetHeight, imgObj: img };
          elements.unshift(imgData); selectedImage = imgData; setActiveTool('pan'); render();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.addEventListener('dragover', (e) => e.preventDefault());
    canvas.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleImageFile(e.dataTransfer.files[0], e.clientX, e.clientY);
    });
    imageInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleImageFile(e.target.files[0]);
    });

    function setActiveTool(tool) {
      currentTool = tool;
      tempEraserMode = false;
      savedTool = null;
      
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + tool);
      if (activeBtn) activeBtn.classList.add('active');
      
      if (globalRuler && tool !== 'unmarked-ruler') {
         document.getElementById('btn-unmarked-ruler').classList.add('active');
      }

      compassStep = 0; compassInitialCenter = null; compassCenter = null; compassRadius = 0;
      protractorStep = 0; protractorCenter = null; protractorRadius = 0;
      
      if (tool !== 'unmarked-ruler') {
          globalRulerP1 = null; 
      }

      isDrawingLinear = false; linearStart = null; isDrawingPen = false; currentPath = [];
      activeSnapPoint = null; clearSelection();

      if (tool === 'pan') { canvas.style.cursor = 'default'; updateStatus('포인터 모드: 화면 이동 및 배치된 이미지 조작'); }
      else if (tool === 'lasso') { canvas.style.cursor = 'crosshair'; updateStatus('올가미: 영역을 둘러싸 선택하세요.'); }
      else if (tool === 'eraser') { canvas.style.cursor = 'pointer'; updateStatus('지우개: 지울 요소를 터치하세요.'); }
      else if (tool === 'pen') { 
        canvas.style.cursor = 'crosshair'; 
        updateStatus(globalRuler ? '자유 곡선 펜 (자 배치됨): 자 근처에서 그리면 직선이 그어집니다.' : '자유 곡선 펜: 자유롭게 그리세요.'); 
      }
      else if (tool === 'point') { canvas.style.cursor = 'crosshair'; updateStatus('점 찍기: 화면을 터치하여 점을 찍으세요.'); }
      else if (tool === 'segment') { canvas.style.cursor = 'crosshair'; updateStatus('선분 작도: 시작점부터 드래그하세요.'); }
      else if (tool === 'line') { canvas.style.cursor = 'crosshair'; updateStatus('직선 작도: 두 점을 지나는 직선을 그립니다.'); }
      else if (tool === 'compass') { canvas.style.cursor = 'crosshair'; updateStatus('컴퍼스 [1단계]: 바늘을 꽂을 중심점을 터치하세요.'); }
      else if (tool === 'ruler') { canvas.style.cursor = 'crosshair'; updateStatus('자(길이 측정): 측정할 선을 드래그하세요.'); }
      else if (tool === 'unmarked-ruler') { canvas.style.cursor = 'crosshair'; updateStatus('눈금 없는 자 [1단계]: 자를 놓을 첫 번째 기준점을 터치하세요. (한 번 더 누르면 사라집니다)'); }
      else if (tool === 'protractor') { canvas.style.cursor = 'crosshair'; updateStatus('각도기 [1단계]: 각도의 중심점(꼭짓점)을 터치하세요.'); }
      render();
    }

    function updateStatus(text) { statusBar.textContent = text; }

    const btnIds = [
      'btn-pan', 'btn-lasso', 'btn-eraser', 'btn-pen', 'btn-point', 'btn-segment', 
      'btn-line', 'btn-compass', 'btn-ruler', 'btn-unmarked-ruler', 'btn-protractor'
    ];
    
    btnIds.forEach(id => {
      const btn = document.getElementById(id);
      if (btn) {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          if (id === 'btn-unmarked-ruler') {
            if (globalRuler || currentTool === 'unmarked-ruler') {
              globalRuler = null;
              globalRulerP1 = null;
              setActiveTool('pan');
            } else {
              setActiveTool('unmarked-ruler');
            }
          } else {
            setActiveTool(id.replace('btn-', ''));
          }
        });
      }
    });

    document.getElementById('btn-upload').addEventListener('click', (e) => { e.preventDefault(); imageInput.click(); });
    document.getElementById('btn-undo').addEventListener('click', (e) => { e.preventDefault(); undo(); });
    document.getElementById('btn-clear').addEventListener('click', (e) => { e.preventDefault(); recordState(); elements = []; selectedImage = null; clearSelection(); render(); });


    // AB=6, BC=4, CA=8; each angle is opposite the named vertex.
    const triangleSides = { AB: 6, BC: 4, CA: 8 };
    const angleFromSides = (adjacent1, adjacent2, opposite) =>
      Math.acos(Math.max(-1, Math.min(1, (adjacent1 ** 2 + adjacent2 ** 2 - opposite ** 2) / (2 * adjacent1 * adjacent2)))) * 180 / Math.PI;
    const triangleAngles = {
      A: angleFromSides(6, 8, 4),
      B: angleFromSides(6, 4, 8),
      C: angleFromSides(4, 8, 6)
    };
    const conditionInputs = [...document.querySelectorAll('#condition-options input')];
    function renderConditions() {
      const selected = conditionInputs.filter(input => input.checked);
      conditionInputs.forEach(input => { input.disabled = selected.length === 3 && !input.checked; });
      document.getElementById('selection-count').textContent = selected.length + ' / 3개';
      document.getElementById('condition-feedback').textContent = selected.length === 3
        ? '3개를 선택했습니다. 다른 조건을 선택하려면 먼저 하나를 해제하세요.'
        : '조건은 최대 3개까지 선택할 수 있습니다.';
      document.getElementById('condition-cards').setAttribute('aria-label',
        selected.length ? selected.map(input => input.value.length === 2 ? '선분 ' + input.value : '각 ' + input.value).join(', ') : '선택한 조건 없음');
      resizeCanvas();
    }
    conditionInputs.forEach(input => input.addEventListener('change', () => {
      if (conditionInputs.filter(item => item.checked).length > 3) input.checked = false;
      renderConditions();
    }));
    renderConditions();
    new ResizeObserver(resizeCanvas).observe(document.querySelector('.lesson-layout'));

    resizeCanvas();
    setActiveTool('pan');
  </script>
</body>
</html>
